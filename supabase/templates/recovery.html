<!-- Filletry auth email (#116). Links go to /auth/confirm with a token_hash, which verifies it
     on any device; next is where the user lands once signed in. -->
<h2>Reset your password</h2>
<p>Open this link to choose a new password for Filletry. It works once and expires in an hour.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/reset-password">Choose a new password</a></p>
<p>If you weren't expecting this email, you can ignore it.</p>
