<!-- Filletry auth email (#116). Links go to /auth/confirm with a token_hash, which verifies it
     on any device; next is where the user lands once signed in. -->
<h2>You're invited to Filletry</h2>
<p>You've been added to a plant on Filletry. Open this link to choose a password and sign in.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=invite&amp;next=/auth/accept">Accept the invite</a></p>
<p>If you weren't expecting this email, you can ignore it.</p>
