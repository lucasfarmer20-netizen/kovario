<!-- Filletry auth email (#116). Links go to /auth/confirm with a token_hash, which verifies it
     on any device; next is where the user lands once signed in. -->
<h2>Confirm your email</h2>
<p>Open this link to confirm your email and set up your plant on Filletry.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup&amp;next=/onboarding">Confirm email</a></p>
<p>If you weren't expecting this email, you can ignore it.</p>
