name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # supabase start pulls ~10 images; the default registry (public.ecr.aws) rate-limits
      # anonymous pulls from shared runners ("toomanyrequests: Data limit exceeded").
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }   # supabase-js realtime needs native WebSocket (Node 22+)
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install receipt renderer browser
        run: pnpm --filter labels exec playwright install --with-deps chromium
      - run: pnpm test                         # root script: vitest run --passWithNoTests across the workspace
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }               # the CLI version packages/db/src/types.ts was generated with
      # The local-stack images (~10, several GB) come from registries that rate-limit popular
      # images across all users, so a cold pull often fails. Cache them per CLI version: one
      # green run fills the cache, later runs load it and pull nothing.
      - name: Restore Supabase image cache
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-images.tar.zst
          key: supabase-images-cli2.122.0-v2
      - name: Load cached Supabase images
        if: steps.imgcache.outputs.cache-hit == 'true'
        run: zstd -dc /tmp/supabase-images.tar.zst | docker load
      - name: Pre-pull local Supabase images (cache miss; one at a time, with retries)
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          # authenticated pulls get a far better share of ghcr.io's per-image rate limit
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          scripts/ci-pull-supabase-images.sh studio logflare
      - name: Apply migrations on a fresh local database
        run: |
          # retry a start that a throttled pull failed (a cold cache can still miss an image),
          # cleaning up the half-started stack in between
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,logflare,vector && break
            [ "$i" = 3 ] && exit 1
            supabase stop --no-backup || true
            sleep $((i * 15))
          done
          supabase db reset
      - run: pnpm db:types                      # regenerates packages/db/src/types.ts; drift is a reviewer check, not a CI gate
      - name: Report types drift (non-blocking)
        run: git diff --exit-code -- packages/db/src/types.ts || echo "::warning file=packages/db/src/types.ts::generated types differ from the committed file; run pnpm db:types"
      - run: pnpm test:db                       # SQL/integration tests against the local DB (passes when none exist)
      - name: Save Supabase images to the cache (cache miss only; after test:db pulled pg_prove)
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|/)(supabase|postgrest)/' | sort -u) \
            | zstd -T0 -3 -o /tmp/supabase-images.tar.zst
          ls -lh /tmp/supabase-images.tar.zst
      - name: Upload Supabase image cache
        if: steps.imgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-images.tar.zst
          key: ${{ steps.imgcache.outputs.cache-primary-key }}
      - run: pnpm build
      - name: e2e smoke (only once apps/web/e2e exists)
        if: ${{ hashFiles('apps/web/e2e/**') != '' }}
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm e2e
