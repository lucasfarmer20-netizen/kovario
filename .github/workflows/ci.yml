name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  # main also deploys to staging (job `deploy`); never cancel that mid-migration
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # supabase start pulls ~10 images; the default registry (public.ecr.aws) rate-limits
      # anonymous pulls from shared runners ("toomanyrequests: Data limit exceeded").
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }   # supabase-js realtime needs native WebSocket (Node 22+)
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Install receipt renderer browser
        run: pnpm --filter labels exec playwright install --with-deps chromium
      - run: pnpm test                         # root script: vitest run --passWithNoTests across the workspace
      - uses: supabase/setup-cli@v1
        with: { version: 2.122.0 }               # the CLI version packages/db/src/types.ts was generated with
      # The local-stack images (~10, several GB) come from registries that rate-limit popular
      # images across all users, so a cold pull often fails. Cache them per CLI version: one
      # green run fills the cache, later runs load it and pull nothing.
      - name: Restore Supabase image cache
        id: imgcache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/supabase-images.tar.zst
          key: supabase-images-cli2.122.0-v2
      - name: Load cached Supabase images
        if: steps.imgcache.outputs.cache-hit == 'true'
        run: zstd -dc /tmp/supabase-images.tar.zst | docker load
      - name: Pre-pull local Supabase images (cache miss; one at a time, with retries)
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          # authenticated pulls get a far better share of ghcr.io's per-image rate limit
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          scripts/ci-pull-supabase-images.sh studio logflare
      - name: Start the local stack
        run: |
          # retry a start that a throttled pull failed (a cold cache can still miss an image),
          # cleaning up the half-started stack in between
          for i in 1 2 3; do
            supabase start -x studio,imgproxy,logflare,vector && break
            [ "$i" = 3 ] && exit 1
            supabase stop --no-backup || true
            sleep $((i * 15))
          done
      - name: Reference data comes from migrations (hosted deploys never seed)
        run: |
          supabase db reset --no-seed
          supabase test db supabase/tests/08_reference_data.test.sql
      - name: Apply migrations and the demo seed on a fresh local database
        run: supabase db reset
      - run: pnpm db:types                      # regenerates packages/db/src/types.ts; drift is a reviewer check, not a CI gate
      - name: Report types drift (non-blocking)
        run: git diff --exit-code -- packages/db/src/types.ts || echo "::warning file=packages/db/src/types.ts::generated types differ from the committed file; run pnpm db:types"
      - run: pnpm test:db                       # SQL/integration tests against the local DB (passes when none exist)
      - name: Save Supabase images to the cache (cache miss only; after test:db pulled pg_prove)
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(^|/)(supabase|postgrest)/' | sort -u) \
            | zstd -T0 -3 -o /tmp/supabase-images.tar.zst
          ls -lh /tmp/supabase-images.tar.zst
      - name: Upload Supabase image cache
        if: steps.imgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/supabase-images.tar.zst
          key: ${{ steps.imgcache.outputs.cache-primary-key }}
      - run: pnpm build
      - name: e2e smoke (only once apps/web/e2e exists)
        if: ${{ hashFiles('apps/web/e2e/**') != '' }}
        run: |
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm e2e

  # A migration that cannot apply on top of staging's real migration history (out-of-order
  # timestamp, a remote-only version) fails here, before merge. Skipped when the staging
  # secrets are absent (forks, or before the one-time setup in docs/11-DEPLOY.md).
  migrations-dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
      # session pooler (runners are IPv4-only); not a secret, overridable by a repo variable
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_STAGING_POOLER_HOST || 'aws-0-us-west-1.pooler.supabase.com' }}
    steps:
      - id: secrets
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::staging secrets not available; migration dry-run skipped"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.present == 'true'
        with: { version: 2.122.0 }               # same CLI as the check job and deploy.yml
      - name: supabase db push --dry-run against staging
        if: steps.secrets.outputs.present == 'true'
        run: bash scripts/deploy-supabase.sh staging --dry-run

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:                              # must cover deploy.yml's top-level permissions
      actions: read
      contents: read
      deployments: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
