# Supabase deploys (docs/11-DEPLOY.md). Every hosted environment gets migrations, Edge
# Functions and config.toml settings from main by automation, never by hand.
#   staging     — every push to main, called by ci.yml once the `check` job is green
#   production  — workflow_dispatch only, for a commit already deployed to staging, and only
#                 after a required reviewer approves the `production` environment
# Secrets are referenced by name only; GitHub masks their values in logs.
name: Deploy
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote to production (must already be deployed to staging)
        required: true
        type: string
permissions:
  actions: read # read the production environment's protection rules
  contents: read
  deployments: read
env:
  SUPABASE_CLI_VERSION: 2.122.0 # keep equal to ci.yml and the root package.json
  PROD_SITE_URL: https://app.filletry.com # DECISION-16
jobs:
  # Staging deploys only when its secrets exist (forks, or before the one-time setup), so
  # main stays green; a partial setup fails loudly instead of half-deploying.
  staging-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_STAGING_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
        run: |
          missing=()
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_STAGING_PROJECT_REF SUPABASE_STAGING_DB_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ ${#missing[@]} -eq 3 ]; then
            echo "::notice::staging deploy skipped: not configured (docs/11-DEPLOY.md §1)"
          else
            echo "::error::staging deploy is partly configured; missing: ${missing[*]} (docs/11-DEPLOY.md §1)"
            exit 1
          fi

  staging:
    needs: staging-preflight
    if: needs.staging-preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_SITE_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false # never interrupt a migration
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: "${{ env.SUPABASE_CLI_VERSION }}" }
      - name: Deploy migrations, Edge Functions and config to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          # session pooler (runners are IPv4-only); not a secret, overridable by a repo variable
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_STAGING_POOLER_HOST || 'aws-0-us-west-1.pooler.supabase.com' }}
          SITE_URL: ${{ vars.STAGING_SITE_URL }} # unset: auth config is not pushed (warning)
          REDIRECT_URLS: ${{ vars.STAGING_REDIRECT_URLS }}
        run: bash scripts/deploy-supabase.sh staging

  # Runs before any approval prompt. Fails unless the commit already has a successful staging
  # deployment. Skips production while the `production` environment does not exist, and fails
  # unless it has required reviewers, admin bypass off and deployment branches = main.
  promote-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_SHA" --jq .sha)
          deployed=false
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=staging&sha=$sha&per_page=100" --jq '.[].id'); do
            if gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[].state' | grep -qx success; then
              deployed=true
            fi
          done
          if [ "$deployed" != true ]; then
            echo "::error::$sha has no successful staging deployment; only commits already on staging can be promoted"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # The environment's rules are the real gate (workflow_dispatch runs the dispatching
          # branch's copy of this file), so refuse a production environment that is not set up
          # as docs/11-DEPLOY.md §1 says: required reviewers, admin bypass off, `main` only.
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/production" > env.json 2> env.err; then
            if grep -q "HTTP 404" env.err; then
              echo "::notice::production skipped: the production environment does not exist yet (docs/11-DEPLOY.md §1)"
              exit 0
            fi
            echo "::error::could not read the production environment: $(tail -1 env.err)"
            exit 1
          fi
          problems=()
          jq -e '[.protection_rules[]?.type] | index("required_reviewers")' env.json >/dev/null \
            || problems+=("no required reviewers")
          jq -e '.can_admins_bypass == false' env.json >/dev/null \
            || problems+=("administrators may bypass the protection rules")
          if jq -e '.deployment_branch_policy.custom_branch_policies == true' env.json >/dev/null; then
            branches=$(gh api "repos/$GITHUB_REPOSITORY/environments/production/deployment-branch-policies" \
              --jq '[.branch_policies[] | "\(.type // "branch"):\(.name)"] | join(",")')
            [ "$branches" = "branch:main" ] || problems+=("deployment branches are '$branches', not only main")
          else
            problems+=("deployment branches are not limited to main")
          fi
          if [ ${#problems[@]} -gt 0 ]; then
            for p in "${problems[@]}"; do echo "::error::production environment: $p (docs/11-DEPLOY.md §1)"; done
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Promoting \`$sha\` (deployed to staging) to production" >> "$GITHUB_STEP_SUMMARY"

  # Waits for a required reviewer before any step runs. The prod secrets (and a prod-scoped
  # SUPABASE_ACCESS_TOKEN that overrides the staging-scoped repository one) are secrets of
  # the `production` environment, so only this approved job can read them.
  production:
    needs: promote-check
    if: needs.promote-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ env.PROD_SITE_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROD_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PROD_DB_PASSWORD }}
    steps:
      - id: secrets
        run: |
          if [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::production skipped: SUPABASE_PROD_PROJECT_REF / SUPABASE_PROD_DB_PASSWORD not set (docs/11-DEPLOY.md §1)"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
        with: { ref: "${{ needs.promote-check.outputs.sha }}" }
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.present == 'true'
        with: { version: "${{ env.SUPABASE_CLI_VERSION }}" }
      - name: Deploy migrations, Edge Functions and config to production
        if: steps.secrets.outputs.present == 'true'
        env:
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_PROD_POOLER_HOST }} # unset: CLI looks it up (needs database_pooling_config_read)
          SITE_URL: ${{ env.PROD_SITE_URL }}
          REDIRECT_URLS: ${{ vars.PROD_REDIRECT_URLS }}
        run: bash scripts/deploy-supabase.sh production
